databricks:
  catalog: main
  schema: mlops_churn

data:
  users_path: /Volumes/main/dbdemos_retail_c360/c360/users
  orders_path: /Volumes/main/dbdemos_retail_c360/c360/orders
  events_path: /Volumes/main/dbdemos_retail_c360/c360/events
  silver_users_table: main.mlops_churn.silver_users
  silver_orders_table: main.mlops_churn.silver_orders
  silver_events_table: main.mlops_churn.silver_events
  gold_features_table: main.mlops_churn.gold_customer_features
  target_column: churn
  id_column: user_id

split:
  test_size: 0.20
  random_state: 42

mlflow:
  tracking_uri: databricks
  experiment_name: /Shared/mlops-churn-prediction
  selection_metric: pr_auc

prediction:
  threshold: 0.50

